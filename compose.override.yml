x-dotnet-common-env: &dotnet-common-env
  Kestrel__Endpoints__Http__Url: http://*:8080
  Kestrel__Endpoints__Https__Url: https://*:8081
  Kestrel__Endpoints__Https__Certificate__Path: /home/app/.aspnet/https/aspnetapp.pfx
  Kestrel__Endpoints__Https__Certificate__Password: devcert
  ASPNETCORE_HTTP_PORTS: "8080"
  ASPNETCORE_HTTPS_PORTS: "8081"
x-auth-common-env: &auth-common-env
  Authentication__Authority: http://keycloak.identity:8080/realms/eshop
  Authentication__ValidIssuer: http://localhost:8080/realms/eshop
  Authentication__ClientId: ${KEYCLOAK_CLIENTID}
  Authentication__Audience: ${KEYCLOAK_AUDIENCE}
x-dotnet-common-volumes: &dotnet-common-volumes
  - ${HOME}/.microsoft/usersecrets:/home/app/.microsoft/usersecrets:ro
  - ${HOME}/.aspnet/https:/home/app/.aspnet/https:ro

services:
  catalogdb:
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
      POSTGRES_DB: CatalogDb
    ports:
      - 5400:5432
    volumes:
      - postgres_catalog:/var/lib/postgresql/data

  basketdb:
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BASKET_DB_PASSWORD}
      POSTGRES_DB: BasketDb
    ports:
      - 5401:5432
    volumes:
      - postgres_basket:/var/lib/postgresql/data

  discountdb:
    image: amazon/dynamodb-local:latest
    container_name: Discount_DB
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_discount:/home/dynamodblocal
    working_dir: /home/dynamodblocal
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ."

  orderdb:
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: OrderDb
    ports:
      - 5402:5432
    volumes:
      - postgres_order:/var/lib/postgresql/data

  keycloak-db:
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    ports:
      - 5403:5432
    volumes:
     - postgres_keycloak:/var/lib/postgresql/data
  
  distributedcache:
    ports:
      - 6379:6379

  messagebroker:
    hostname: eshop-mq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - 5672:5672
      - 15672:15672

  keycloak.identity:
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KK_TO_RMQ_URL: messagebroker
      KK_TO_RMQ_PORT: 5672
      KK_TO_RMQ_VHOST: /
      KK_TO_RMQ_EXCHANGE: keycloak.exchange
      KK_TO_RMQ_USERNAME: ${RABBITMQ_USER}
      KK_TO_RMQ_PASSWORD: ${RABBITMQ_PASS}
    depends_on:
      - keycloak-db
    command:
      - start-dev
      - --import-realm
    ports:
      - 8080:8080
    volumes:
      - ./keycloak-config/conf/keycloak.conf:/opt/keycloak/conf/keycloak.conf:ro
      - ./keycloak-config/data/import/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak-config/providers/keycloak-to-rabbit-3.0.5.jar:/opt/keycloak/providers/keycloak-to-rabbit-3.0.5.jar:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/eshop"]
      interval: 10s
      timeout: 5s
      retries: 10

  catalog.api:
    environment:
      <<: [ *dotnet-common-env, *auth-common-env ]
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Server=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=${CATALOG_DB_PASSWORD};Include Error Detail=true
      MessageBroker__Host: amqp://messagebroker:5672
      MessageBroker__UserName: ${RABBITMQ_USER}
      MessageBroker__Password: ${RABBITMQ_PASS}
    depends_on:
      - catalogdb
      - messagebroker
      - keycloak.identity
    ports:
      - 6000:8080
      - 6060:8081
    volumes: *dotnet-common-volumes

  basket.api:
    environment:
      <<: [ *dotnet-common-env, *auth-common-env ]
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Server=basketdb;Port=5432;Database=BasketDb;User Id=postgres;Password=${BASKET_DB_PASSWORD};Include Error Detail=true
      ConnectionStrings__Redis: distributedcache:6379
      MessageBroker__Host: amqp://messagebroker:5672
      MessageBroker__UserName: ${RABBITMQ_USER}
      MessageBroker__Password: ${RABBITMQ_PASS}
      GrpcSettings__CatalogUrl: https://catalog.api:8081
      GrpcSettings__DiscountUrl: https://discount.grpc:8081
    depends_on:
      - basketdb
      - distributedcache
      - messagebroker
      - catalog.api
      - discount.grpc
      - keycloak.identity
    ports:
      - 6001:8080
      - 6061:8081
    volumes: *dotnet-common-volumes

  discount.grpc:
    environment:
      <<: [ *dotnet-common-env, *auth-common-env ]
      ASPNETCORE_ENVIRONMENT: Development
      DynamoDb__ServiceUrl: http://discountdb:8000
      DynamoDb__Region: us-east-1
      DynamoDb__TableName: Coupons
      DynamoDb__CountersTableName: Counters
      DynamoDb__AccessKeyId: DYNAMODB
      DynamoDb__SecretAccessKey: DYNAMODB
      DynamoDb__Seed: "true"
    depends_on:
      - discountdb
      - keycloak.identity
    ports:
      - 6002:8080
      - 6062:8081
    volumes: *dotnet-common-volumes

  ordering.api:
    environment:
      <<: [ *dotnet-common-env, *auth-common-env ]
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Server=orderdb;Port=5432;Database=OrderDb;User Id=postgres;Password=${ORDER_DB_PASSWORD};Include Error Detail=true
      ConnectionStrings__Redis: distributedcache:6379
      MessageBroker__Host: amqp://messagebroker:5672
      MessageBroker__UserName: ${RABBITMQ_USER}
      MessageBroker__Password: ${RABBITMQ_PASS}
      GrpcSettings__CatalogUrl: https://catalog.api:8081
      Keycloak__BaseUrl: http://keycloak.identity:8080
      Keycloak__Realm: eshop
      Keycloak__ClientId: ordering-service
      Keycloak__ClientSecret: ${KEYCLOAK_SECRET}
      Keycloak__GrantType: client_credentials      
      FeatureManagement__OrderFullfilment: false
    depends_on:
      - orderdb
      - distributedcache
      - messagebroker
      - catalog.api
      - keycloak.identity
    ports:
      - 6003:8080
      - 6063:8081
    volumes: *dotnet-common-volumes

  yarpapigateway:
    environment:
      <<: [ *dotnet-common-env, *auth-common-env ]
      ASPNETCORE_ENVIRONMENT: Docker
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:6005,http://localhost:6065
    depends_on:
      - catalog.api
      - basket.api
      - ordering.api
      - keycloak.identity
    ports:
      - 6004:8080
      - 6064:8081
    volumes: *dotnet-common-volumes

  client.web:
    environment:
      YARP_API_URL: http://localhost:6004 
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: eshop
      KEYCLOAK_CLIENTID: reactApp
    depends_on:
      - yarpapigateway
      - keycloak.identity
    ports:
      - 6005:8080
      - 6065:8080