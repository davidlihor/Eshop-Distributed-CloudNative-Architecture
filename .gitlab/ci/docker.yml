docker-build:
  stage: build
  extends: 
    - .docker_base
    - .docker_services_matrix
  needs:
    - job: secrets-scan
    - job: lint-and-test
      optional: true
    - job: semgrep-security-gate
    - job: iac-scan
    - job: license-scan
  variables:
    FULL_IMAGE_PATH: "$CI_REGISTRY_IMAGE/$IMAGE_NAME"
    CACHE_IMAGE: "$FULL_IMAGE_PATH:buildcache"
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ${PATH_DIR}/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ${PATH_DIR}/**/*
    - when: never
  before_script:
    - apk add --no-cache jq
    - git fetch --all
    - git checkout $CI_COMMIT_SHA
  script:
    - |
      docker buildx build \
        --progress=plain \
        --platform linux/amd64 \
        --tag $FULL_IMAGE_PATH:$CI_COMMIT_SHA \
        -f ${PATH_DIR}/Dockerfile \
        --cache-from type=registry,ref=$CACHE_IMAGE \
        --load \
        .
        
    - |
      docker run --rm \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -v "$PWD":/work -w /work \
      -v "$HOME/.cache/trivy":/root/.cache/trivy \
      aquasec/trivy:0.68.1 image \
      --scanners vuln \
      --severity HIGH,CRITICAL \
      --format table \
      $FULL_IMAGE_PATH:$CI_COMMIT_SHA

    - |
      docker run --rm \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -v "$PWD":/work -w /work \
      -v "$HOME/.cache/trivy":/root/.cache/trivy \
      aquasec/trivy:0.68.1 image \
      --scanners vuln \
      --severity HIGH,CRITICAL \
      --format json \
      --output gl-trivy-container-scanning-report-$IMAGE_NAME.json \
      $FULL_IMAGE_PATH:$CI_COMMIT_SHA

    - |
      # Policy:
      # - FAIL if there are CRITICAL issues
      # - FAIL if HIGH > 5
      # - Rationale: the image must be deployable without major risk

      CRIT=$(jq '
        .Results[].Vulnerabilities? // []
        | map(select(.Severity=="CRITICAL"))
        | length
      ' gl-trivy-container-scanning-report-$IMAGE_NAME.json)

      HIGH=$(jq '
        .Results[].Vulnerabilities? // []
        | map(select(.Severity=="HIGH"))
        | length
      ' gl-trivy-container-scanning-report-$IMAGE_NAME.json)

      if [ "$CRIT" -gt 0 ]; then
        echo "Container policy violation: $CRIT CRITICAL vulnerabilities"
        exit 1
      fi

      if [ "$HIGH" -gt 5 ]; then
        echo "Container policy violation: too many HIGH vulnerabilities ($HIGH)"
        exit 1
      fi
  
      echo "Container policy passed"

    - docker push $FULL_IMAGE_PATH:$CI_COMMIT_SHA
    - docker tag $FULL_IMAGE_PATH:$CI_COMMIT_SHA $FULL_IMAGE_PATH:candidate
    - docker push $FULL_IMAGE_PATH:candidate
  artifacts:
    reports:
      container_scanning: gl-trivy-container-scanning-report-$IMAGE_NAME.json
    expire_in: 1 week
