docker-build:
  stage: build
  extends: 
    - .docker_base
    - .docker_services_matrix
  needs:
    - job: secrets-scan
    - job: lint-and-test
      optional: true
    - job: semgrep-security-gate
    - job: iac-scan
    - job: license-scan
  variables:
    FULL_IMAGE_PATH: "$CI_REGISTRY_IMAGE/$IMAGE_NAME"
    CACHE_IMAGE: "$FULL_IMAGE_PATH:buildcache"
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ${PATH_DIR}/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ${PATH_DIR}/**/*
    - when: never
  before_script:
    - apk add --no-cache jq
    - git fetch --all
    - git checkout $CI_COMMIT_SHA
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker buildx create --use --name ci-builder || docker buildx use ci-builder
    - docker buildx inspect --bootstrap
  script:
    - |
      docker buildx build \
        --progress=plain \
        --platform linux/amd64 \
        --tag $FULL_IMAGE_PATH:$CI_COMMIT_SHA \
        -f ${PATH_DIR}/Dockerfile \
        --cache-from type=registry,ref=$CACHE_IMAGE \
        --load \
        .
        
    - |
      docker run --rm \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -v "$PWD":/work -w /work \
      -v "$HOME/.cache/trivy":/root/.cache/trivy \
      aquasec/trivy:0.68.1 image \
      --scanners vuln \
      --severity HIGH,CRITICAL \
      --format table \
      $FULL_IMAGE_PATH:$CI_COMMIT_SHA

    - |
      docker run --rm \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -v "$PWD":/work -w /work \
      -v "$HOME/.cache/trivy":/root/.cache/trivy \
      aquasec/trivy:0.68.1 image \
      --scanners vuln \
      --severity HIGH,CRITICAL \
      --format json \
      --output gl-trivy-container-scanning-report-$IMAGE_NAME.json \
      $FULL_IMAGE_PATH:$CI_COMMIT_SHA

    - |
      CRIT_WITH_FIX=$(jq '
        .Results[].Vulnerabilities? // [] |
        map(select(.Severity=="CRITICAL" and .FixedVersion != null and .FixedVersion != "")) |
        length
      ' gl-trivy-container-scanning-report-$IMAGE_NAME.json)

    - |
      HIGH_WITH_FIX=$(jq '
        .Results[].Vulnerabilities? // [] |
        map(select(.Severity=="HIGH" and .FixedVersion != null and .FixedVersion != "")) |
        length
      ' gl-trivy-container-scanning-report-$IMAGE_NAME.json)

    - |
      echo "CRITICAL with fix available: $CRIT_WITH_FIX"
      echo "HIGH with fix available: $HIGH_WITH_FIX"

    - |
      if [ "$CRIT_WITH_FIX" -gt 0 ]; then
        echo "Pipeline failed: CRITICAL vulnerabilities with fixes available"
        exit 1
      fi

      if [ "$HIGH_WITH_FIX" -gt 0 ]; then
        echo "Pipeline failed: HIGH vulnerabilities with fixes available"
        exit 1
      fi

      echo "No fixable HIGH/CRITICAL vulnerabilities found. Continuing..."

    - docker push $FULL_IMAGE_PATH:$CI_COMMIT_SHA
    - docker tag $FULL_IMAGE_PATH:$CI_COMMIT_SHA $FULL_IMAGE_PATH:candidate
    - docker push $FULL_IMAGE_PATH:candidate
  artifacts:
    reports:
      container_scanning: gl-trivy-container-scanning-report-$IMAGE_NAME.json
    expire_in: 1 week
