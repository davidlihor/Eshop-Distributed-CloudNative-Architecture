.security_base:
  stage: security-static
  needs: []
  before_script:
    - |
      if command -v apk >/dev/null 2>&1; then
        apk add --no-cache jq
      elif command -v apt-get >/dev/null 2>&1; then
        apt-get update && apt-get install -y jq
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  artifacts:
    when: always
    expire_in: 1 week
