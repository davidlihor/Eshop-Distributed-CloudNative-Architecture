apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ratelimit-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: eshop-project
  source:
    repoURL: https://github.com/davidlihor/Eshop-Distributed-CloudNative-Architecture.git
    targetRevision: HEAD
    path: helm/ratelimit
    helm:
      values: |
        hosts:
          hostApp: app.eshop.dev
          hostApi: api.eshop.dev
          hostId: id.eshop.dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ratelimit-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
