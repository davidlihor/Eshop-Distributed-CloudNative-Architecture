apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-custom-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: eshop-project
  source:
    repoURL: https://github.com/davidlihor/Eshop-Distributed-CloudNative-Architecture.git
    targetRevision: HEAD
    path: helm/istio
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
