{{- range .Values.services }}
{{- if hasSuffix "-clusterip" .name }}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ .selector }}-dr
  namespace: {{ $.Values.global.namespace }}
spec:
  host: {{ .name }}.{{ $.Values.global.namespace }}.svc.cluster.local
  subsets:
    - name: stable
      labels:
        app: {{ .selector }}
    - name: canary
      labels:
        app: {{ .selector }}
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http2MaxRequests: 1000
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 5s
      baseEjectionTime: 30s
{{- end }}
{{- end }}