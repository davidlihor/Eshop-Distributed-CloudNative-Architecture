{{- if and .Values.security.istio.enabled .Values.global.monitoring }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiali-admin-user-cluster-view
subjects:
  - kind: User
    name: admin@eshop.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
{{- end }}
