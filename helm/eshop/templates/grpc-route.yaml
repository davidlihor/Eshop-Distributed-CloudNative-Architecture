apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: catalog-api-grpc-route
  namespace: {{ $.Values.global.namespace }}
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: catalog-clusterip
    namespace: {{ $.Values.global.namespace }}
  - group: gateway.networking.k8s.io
    kind: Mesh
    name: mesh
    namespace: istio-system
  rules:
  - matches:
    - headers:
      - name: x-version
        value: canary
    backendRefs:
    - name: catalog-clusterip-canary
      port: 8081
  - backendRefs:
    - name: catalog-clusterip
      port: 8081
      weight: 100
    - name: catalog-clusterip-canary
      port: 8081
      weight: 0
---
