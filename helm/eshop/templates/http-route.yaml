{{- range .Values.services }}
{{- if and .ports (hasSuffix "-clusterip" .name) (ne .name "yarp-api-gateway-clusterip") }}
{{- $serviceName := .name }}
{{- $host := "" }}
{{- $path := "" }}
{{- $isSpecial := false }}
{{- if eq $serviceName "web-client-clusterip" }}
  {{- $host = $.Values.security.istio.hosts.hostApp }}
  {{- $path = "/" }}
  {{- $isSpecial = true }}
{{- else if eq $serviceName "keycloak-clusterip" }}
  {{- $host = $.Values.security.istio.hosts.hostId }}
  {{- $path = "/" }}
  {{- $isSpecial = true }}
{{- else }}
  {{- $host = $.Values.security.istio.hosts.hostApi }}
  {{- $trimmedName := $serviceName | replace "-clusterip" "" }}
  {{- $path = printf "/%s-service/" $trimmedName }}
{{- end }}

{{- $httpPort := 0 }}
{{- range .ports }}
  {{- if eq .name "http" }}
    {{- $httpPort = .port }}
  {{- end }}
{{- end }}

{{- if $httpPort }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $serviceName }}-http-route
  namespace: {{ $.Values.global.namespace }}
spec:
  parentRefs:
  - name: eshop-gateway
    group: gateway.networking.k8s.io	
    kind: Gateway
    namespace: istio-system
  hostnames:
  - {{ tpl (toString $host) $ | quote }}
  rules:
  - matches:
    - path: 
        type: PathPrefix
        value: {{ $path }}
    {{- if not $isSpecial }}
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    - type: CORS
      cors:
        allowOrigins:
        - "https://{{ tpl $.Values.security.istio.hosts.hostApp $ }}"
        allowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        allowHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
        allowCredentials: true
        maxAge: 86400
    {{- end }}
    backendRefs:
    {{- if eq (default "" .strategyType) "canary" }}
    - name: {{ $serviceName }}
      port: {{ $httpPort }}
      weight: 100
      group: ''
      kind: Service
    - name: {{ $serviceName }}-canary
      port: {{ $httpPort }}
      weight: 0
      group: ''
      kind: Service
      filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          add:
          - name: x-version
            value: canary
    {{- else }}
    - name: {{ $serviceName }}
      port: {{ $httpPort }}
      weight: 100
      group: ''
      kind: Service
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
---
{{- if $.Values.global.monitoring }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
  - name: eshop-gateway
    group: gateway.networking.k8s.io
    kind: Gateway
    namespace: istio-system
  hostnames:
  - {{ tpl (toString $.Values.security.istio.hosts.hostGrafana) $ | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: grafana
      port: 80
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  parentRefs:
  - name: eshop-gateway
    group: gateway.networking.k8s.io
    kind: Gateway
    namespace: istio-system
  hostnames:
  - {{ tpl (toString $.Values.security.istio.hosts.hostArgoCD) $ | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: argo-cd-argocd-server
      port: 80
      group: ''
      kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali-route
  namespace: monitoring
spec:
  parentRefs:
  - name: eshop-gateway
    group: gateway.networking.k8s.io
    kind: Gateway
    namespace: istio-system
  hostnames:
  - {{ tpl (toString $.Values.security.istio.hosts.hostKiali) $ | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kiali
      port: 20001
      group: ''
      kind: Service
