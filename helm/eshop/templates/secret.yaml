{{- range .Values.apps }}
{{- if and .secrets (not .externalSecrets) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-secret
  namespace: {{ $.Values.global.namespace }}
type: Opaque
data:
{{- range $key, $val := .secrets }}
  {{ $key }}: {{ $val | b64enc | quote }}
{{- end }}
---
{{- end }}

{{- if .externalSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}-external-secret
  namespace: {{ $.Values.global.namespace }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ .externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .name }}-secret
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: {{ tpl (toString .externalSecrets.remoteRef) $ | quote }}
---
{{- end }}
{{- end }}
