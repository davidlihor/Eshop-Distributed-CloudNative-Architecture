apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ tpl (toString .Values.security.issuer.name) $ | quote }}
spec:
  acme:
    server: {{ .Values.security.issuer.server | quote }}
    email: {{ .Values.security.issuer.email | quote }}
    privateKeySecretRef:
      name: {{ tpl (toString .Values.security.issuer.name) $ }}-account-key
    solvers:
    - dns01:
        route53:
          region: {{ .Values.aws.region | quote }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.global.projectName }}-wildcard-cert
  namespace: {{ .Values.security.istio.namespace }}
spec:
  secretName: {{ tpl (toString .Values.security.istio.tlsSecret) $ | quote }}
  issuerRef:
    name: {{ tpl (toString .Values.security.issuer.name) $ | quote }}
    kind: ClusterIssuer
  commonName: "{{ .Values.global.projectName }}.{{ .Values.global.domain }}"
  dnsNames:
    - "{{ .Values.global.projectName }}.{{ .Values.global.domain }}"
    - "*.{{ .Values.global.projectName }}.{{ .Values.global.domain }}"
    - "*.{{ .Values.global.environment }}.{{ .Values.global.projectName }}.{{ .Values.global.domain }}"
