apiVersion: v1
kind: Namespace
metadata:
  name: traffic-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: traffic-control
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: redis
  template:
    metadata:
      labels: 
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: traffic-control
spec:
  selector: 
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
