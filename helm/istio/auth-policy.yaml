apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-from-outside-trusted-namespaces
  namespace: eshop
spec:
  selector:
    matchLabels: {}
  action: DENY
  rules:
  - from:
    - source:
        notNamespaces: ["eshop","istio-system"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-catalog-to-catalogdb
  namespace: eshop
spec:
  selector:
    matchLabels:
      app: catalog-db
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/eshop/sa/catalog-sa"]
    to:
    - operation:
        ports: ["5432"]
---
