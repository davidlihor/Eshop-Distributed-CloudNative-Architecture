global:
  extraEnvFrom: []
mimir:
  memberlist:
    service:
      publishNotReadyAddresses: true
  structuredConfig:
    common:
      storage:
        backend: s3
        s3:
          bucket_name: eshop-dev-mimir-storage-tgxj
          endpoint: s3.us-east-1.amazonaws.com
          region: us-east-1
          insecure: false
    memberlist:
      join_members:
        - mimir-distributed-gossip-ring.monitoring.svc.cluster.local
    blocks_storage:
      backend: s3
      s3:
        bucket_name: eshop-dev-mimir-storage-tgxj
        region: us-east-1
        endpoint: s3.us-east-1.amazonaws.com
serviceAccount:
  create: true
  name: mimir
ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "2"
      memory: "6Gi" 
  persistentVolume:
    size: 20Gi
    storageClass: "ebs-encrypted-gp3"
  securityContext: &mimirSecurityContext
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
querier:
  replicas: 1
  securityContext: *mimirSecurityContext
distributor:
  replicas: 1
  securityContext: *mimirSecurityContext
compactor:
  replicas: 1
  securityContext: *mimirSecurityContext
store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  securityContext: *mimirSecurityContext
query_scheduler:
  replicas: 1
  securityContext: *mimirSecurityContext
alertmanager:
  enabled: false
ruler:
  enabled: false
minio:
  enabled: false