global:
  extraEnvFrom:
    - secretRef:
        name: loki-s3-secrets
loki:
  deploymentMode: SimpleScalable
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: minio.monitoring.svc.cluster.local:9000
      region: us-east-1
      insecure: true
      s3ForcePathStyle: true
  limits_config:
    retention_period: 168h
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
memberlist:
  service:
    publishNotReadyAddresses: true
backend:
  replicas: 1
read:
  replicas: 1
write:
  replicas: 1
test:
  enabled: false
lokiCanary:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false