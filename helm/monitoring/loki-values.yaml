global:
  extraEnvFrom: []
loki:
  deploymentMode: SimpleScalable
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: s3
    bucketNames:
      chunks: eshop-dev-loki-storage-tgxj
      ruler: eshop-dev-loki-storage-tgxj
      admin: eshop-dev-loki-storage-tgxj
    s3:
      region: us-east-1
  limits_config:
    retention_period: 168h
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
serviceAccount:
  create: true
  name: loki
memberlist:
  service:
    publishNotReadyAddresses: true
backend:
  replicas: 1
read:
  replicas: 1
write:
  replicas: 1
test:
  enabled: false
lokiCanary:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false