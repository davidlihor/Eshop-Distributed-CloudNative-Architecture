namespaced: false
sources:
  - service
  - ingress
  - gateway-httproute
  - istio-gateway
  - istio-virtualservice
provider: aws
env:
  - name: AWS_REGION
    value: us-east-1
policy: sync
txtOwnerId: davidlihor-eks-cluster
domainFilters:
  - davidlihor.com
serviceAccount:
  create: true
  name: external-dns
logLevel: debug
image:
  repository: registry.k8s.io/external-dns/external-dns
  tag: v0.20.0
  pullPolicy: IfNotPresent
rbac:
  create: true
  additionalPermissions:
    - apiGroups: ["discovery.k8s.io"]
      resources: ["endpointslices"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["networking.x-k8s.io"]
      resources: ["gateways", "httproutes"]
      verbs: ["get", "list", "watch"]
